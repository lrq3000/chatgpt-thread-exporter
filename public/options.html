<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Thread Exporter Options</title>
  </head>
  <body>
    <main>
      <h1>ChatGPT Thread Exporter</h1>
      <label>
        <input id="include-tool-outputs" type="checkbox">
        Include tool and connector outputs
      </label>
      <label>
        <input id="include-reasoning-nodes" type="checkbox">
        Include reasoning and recap nodes
      </label>
      <label>
        <input id="save-to-file" type="checkbox">
        Save the export to a Markdown file (file picker) instead of copying to the clipboard
      </label>
    </main>
    <script src="js/options.bundle.js"></script>
  </body>
</html>
